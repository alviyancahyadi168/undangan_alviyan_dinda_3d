<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alviyan & Dinda — Stage 7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
:root{--gold:#a9793b;--ivory:#fbf7f0;--ink:#4b392b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efe4;color:var(--ink)}
#cinematic{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fffdf9 0,#f8eee0 52%,#dfc9aa 100%);transition:opacity 1.4s,visibility 1.4s}
#cinematic.hide{opacity:0;visibility:hidden;pointer-events:none}.ring{position:absolute;border:1px solid rgba(169,121,59,.18);border-radius:50%;width:min(82vw,900px);height:min(82vw,900px);animation:pulse 5s ease-in-out infinite}.ring.r2{width:min(62vw,700px);height:min(62vw,700px);animation-delay:1.1s}.ring.r3{width:min(42vw,500px);height:min(42vw,500px);animation-delay:2.1s}@keyframes pulse{50%{transform:scale(1.035);opacity:.55}}
.intro{text-align:center;position:relative;z-index:3;padding:24px}.eyebrow{font:500 10px Montserrat,sans-serif;letter-spacing:6px;color:var(--gold)}h1{font:600 clamp(66px,12vw,145px)/.72 'Cormorant Garamond',serif;color:#a06f35;margin:28px 0 32px}h1 span{display:block}.date{font:500 11px Montserrat,sans-serif;letter-spacing:5px;color:#765c45}.subtitle{font:400 17px/1.7 'Cormorant Garamond',serif;margin:24px auto 34px;max-width:560px;color:#6f5a48}.start{border:1px solid var(--gold);background:rgba(255,253,249,.72);color:#80582b;border-radius:30px;padding:15px 30px;font:500 9px Montserrat,sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.3s}.start:hover{background:var(--gold);color:white;transform:translateY(-2px)}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.p{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(169,121,59,.5);animation:float linear infinite}@keyframes float{from{transform:translate3d(0,110vh,0) scale(.5);opacity:0}15%{opacity:.7}85%{opacity:.35}to{transform:translate3d(var(--drift),-10vh,0) scale(1);opacity:0}}
#app{position:fixed;inset:0;background:var(--ivory)}iframe{width:100%;height:100%;border:0;display:block}.music{position:fixed;right:18px;top:18px;z-index:50;width:42px;height:42px;border:1px solid rgba(169,121,59,.45);border-radius:50%;background:rgba(255,253,249,.82);color:var(--gold);cursor:pointer;font-size:16px;box-shadow:0 8px 22px rgba(80,54,30,.12);opacity:0;transition:opacity .8s}.music.on{opacity:1}.music.playing{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.credit{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font:400 8px Montserrat,sans-serif;letter-spacing:2px;color:#8b7259;white-space:nowrap}
</style></head>
<body>
<div id="cinematic"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div id="particles"></div><div class="intro"><div class="eyebrow">THE WEDDING OF</div><h1><span>Alviyan</span><span>&amp; Dinda</span></h1><div class="date">7 NOVEMBER 2026</div><div class="subtitle">Sebuah perjalanan cinta, kenangan, dan doa.<br>Selamat datang di hari istimewa kami.</div><button class="start" id="start">Mulai Perjalanan</button></div><div class="credit">MEMORIES · LAUGHTER · FOREVER</div></div>
<div id="app"><iframe id="stage6" src="stage6-final.html" title="Undangan 3D Alviyan dan Dinda"></iframe></div>
<button class="music" id="music" title="Musik">♪</button>
<script>
const particles=document.getElementById('particles');
for(let i=0;i<34;i++){const p=document.createElement('i');p.className='p';p.style.left=Math.random()*100+'%';p.style.animationDuration=(7+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*12)+'s';p.style.setProperty('--drift',((Math.random()-.5)*180)+'px');p.style.opacity=.2+Math.random()*.5;particles.appendChild(p)}
let ctx=null,master=null,playing=false,osc=[];
function startAudio(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.035;master.connect(ctx.destination)} if(ctx.state==='suspended')ctx.resume(); if(playing)return; playing=true; document.getElementById('music').classList.add('playing'); const notes=[261.63,329.63,392,523.25]; notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.28,ctx.currentTime+1.4+i*.25);g.gain.linearRampToValueAtTime(0,ctx.currentTime+5.5+i*.25);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+6.2+i*.25);osc.push(o)}); setTimeout(()=>{playing=false;document.getElementById('music').classList.remove('playing')},7200)}
function stopAudio(){if(ctx){master.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);playing=false;document.getElementById('music').classList.remove('playing')}}
const music=document.getElementById('music');music.onclick=()=>playing?stopAudio():startAudio();
document.getElementById('start').onclick=()=>{startAudio();document.getElementById('cinematic').classList.add('hide');music.classList.add('on')};
</script></body></html>
