<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alviyan & Dinda — Stage 6</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
:root{--ivory:#fbf7f0;--cream:#eee1cf;--gold:#a9793b;--gold2:#d8bb8a;--ink:#3b2d25}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ivory);color:var(--ink)}body{font-family:Montserrat,sans-serif}
.scene{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#fffefa 0,#f8eee2 48%,#dfccb1 100%);perspective:1800px;transition:opacity 1s,visibility 1s}
.scene:before{content:"";position:absolute;width:min(88vw,1050px);height:min(88vw,1050px);border:1px solid rgba(169,121,59,.16);border-radius:50%}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(255,255,255,.9),transparent 20%),radial-gradient(circle at 83% 76%,rgba(255,255,255,.8),transparent 22%)}
.envelope-wrap{position:relative;width:min(720px,88vw);height:min(500px,61vw);min-height:330px;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.2,.8,.2,1);z-index:3}
.envelope{position:absolute;inset:0;background:linear-gradient(145deg,#fffdf9,#eee0cd);border:1px solid rgba(169,121,59,.3);box-shadow:0 45px 100px rgba(61,43,26,.2);overflow:visible}
.envelope:before{content:"";position:absolute;inset:20px;border:1px solid rgba(169,121,59,.16);pointer-events:none}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;background:linear-gradient(155deg,#fdf9f2,#e9d7bf);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform 1.35s cubic-bezier(.2,.75,.2,1);z-index:5;border-top:1px solid rgba(169,121,59,.25)}
.seal{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d8bb8a,#a9793b);color:#fff8ed;font:600 27px 'Cormorant Garamond',serif;box-shadow:0 12px 25px rgba(77,52,28,.2);z-index:8;transition:opacity .55s,transform .8s}
.letter{position:absolute;left:7%;right:7%;top:6%;height:88%;background:#fffdfa;border:1px solid rgba(169,121,59,.18);box-shadow:0 18px 40px rgba(62,45,30,.13);display:grid;place-items:center;text-align:center;z-index:2;transform:translateY(14%);transition:transform 1.2s cubic-bezier(.2,.75,.2,1) .2s}
.letter-inner{padding:25px}.letter .eyebrow{font-size:9px;letter-spacing:5px;color:var(--gold)}.letter h1{font:600 clamp(48px,8vw,88px)/.78 'Cormorant Garamond',serif;color:#a06f35;margin:20px 0}.letter h1 span{display:block}.letter .date{font-size:11px;letter-spacing:4px;color:#765b42}
.open-btn{position:absolute;left:50%;bottom:-90px;transform:translateX(-50%);z-index:10;padding:14px 30px;border:1px solid var(--gold);border-radius:30px;background:rgba(255,253,249,.85);color:#80582b;font:500 9px Montserrat,sans-serif;letter-spacing:3px;text-transform:uppercase;cursor:pointer;white-space:nowrap;box-shadow:0 10px 30px rgba(62,45,30,.1)}.open-btn:hover{background:var(--gold);color:#fff}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:#806346;text-transform:uppercase;z-index:2}
.experience{position:fixed;inset:0;background:#fbf7f0;opacity:0;visibility:hidden;transition:opacity 1.1s ease}.experience iframe{width:100%;height:100%;border:0;display:block}
.open .flap{transform:rotateX(-170deg)}.open .letter{transform:translateY(-45%)}.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}.open .envelope-wrap{transform:translateY(15px) rotateX(2deg)}
.reveal .scene{opacity:0;visibility:hidden;pointer-events:none}.reveal .experience{opacity:1;visibility:visible}
.skip{position:fixed;right:18px;bottom:16px;z-index:20;border:0;background:rgba(255,253,249,.55);color:#806346;font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:9px 12px;cursor:pointer;border-radius:20px}
@media(max-width:650px){.envelope-wrap{width:90vw;height:58vw;min-height:250px}.letter h1{font-size:54px}.seal{width:64px;height:64px;font-size:22px}.open-btn{bottom:-72px}.hint{bottom:16px;font-size:7px}.letter-inner{padding:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="envelope-wrap" id="wrap">
    <div class="envelope">
      <div class="letter"><div class="letter-inner"><div class="eyebrow">THE WEDDING OF</div><h1><span>Alviyan</span><span>&amp;</span><span>Dinda</span></h1><div class="date">7 NOVEMBER 2026</div></div></div>
      <div class="flap"></div>
      <div class="seal">A&amp;D</div>
    </div>
    <button class="open-btn" id="openBtn">Buka Undangan</button>
  </div>
  <div class="hint">A journey of love · memories · laughter · forever</div>
</div>
<div class="experience" id="experience"><iframe src="stage5-final.html" title="Undangan Alviyan dan Dinda"></iframe></div>
<button class="skip" id="skip">Lewati pembukaan</button>
<script>
const body=document.body,scene=document.getElementById('scene'),openBtn=document.getElementById('openBtn'),skip=document.getElementById('skip');
function reveal(){body.classList.add('open');openBtn.disabled=true;setTimeout(()=>body.classList.add('reveal'),1450)}
openBtn.addEventListener('click',reveal);
scene.addEventListener('dblclick',reveal);
skip.addEventListener('click',()=>body.classList.add('reveal'));
</script>
</body>
</html>
